name: OmnieDev
options:
  bundleIdPrefix: ai.wckd
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  DesignKit:
    path: packages/DesignKit
  CommandKit:
    path: packages/CommandKit
  WorkspaceKit:
    path: packages/WorkspaceKit
  GitKit:
    path: packages/GitKit
  LangKit:
    path: packages/LangKit
  EditorKit:
    path: packages/EditorKit
  SecretsKit:
    path: packages/SecretsKit
  PolicyKit:
    path: packages/PolicyKit
  ModelKit:
    path: packages/ModelKit
  AgentKit:
    path: packages/AgentKit
  RunKit:
    path: packages/RunKit
  TermKit:
    path: packages/TermKit
  ToolsKit:
    path: packages/ToolsKit
  # P0 spike 2: local models (moves into ModelKit after the spike).
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "202610092"

targets:
  OmnieDev:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - OmnieDevUITests
    sources:
      - apps/ipad/Sources
      - apps/ipad/Resources/Assets.xcassets
      - apps/ipad/Resources/Acknowledgements.json
      - apps/ipad/Resources/PrivacyInfo.xcprivacy
      - path: apps/ipad/Resources/WASISpikeApp
        type: folder
      # The sample project on the welcome screen (also the plane test's fixture).
      - path: fixtures/plane-demo
        type: folder
        buildPhase: resources
      # Vendored by scripts/vendor-wasi-spike.py (gitignored).
      - path: apps/ipad/Resources/WASISpike
        type: folder
        optional: true
    dependencies:
      - package: DesignKit
      - package: CommandKit
      - package: WorkspaceKit
      - package: GitKit
      - package: LangKit
      - package: EditorKit
      - package: SecretsKit
      - package: PolicyKit
      - package: ModelKit
      - package: AgentKit
      - package: RunKit
      - package: TermKit
      - package: ToolsKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wckd.omniedev
        PRODUCT_NAME: OmnieDev
        # 1 = iPhone (vibecoding), 2 = iPad (full IDE)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Omnie Dev"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: apps/ipad/OmnieDev.entitlements
        DEVELOPMENT_TEAM: XKA8CGC2AB
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools

  # The editor's hands-on checks that can be automated (docs/spikes/editor-p0.md tests 7 and 8):
  # real key events through XCUITest, and Apple's accessibility audit. Runs on the simulator or
  # the iPad: xcodebuild test -scheme OmnieDev -destination ...
  OmnieDevUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - apps/ipad/UITests
    dependencies:
      - target: OmnieDev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wckd.omniedev.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XKA8CGC2AB
        TEST_TARGET_NAME: OmnieDev
        TARGETED_DEVICE_FAMILY: "1,2"
