name: OmnieDev
options:
  bundleIdPrefix: ai.wckd
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  DesignKit:
    path: packages/DesignKit
  CommandKit:
    path: packages/CommandKit
  WorkspaceKit:
    path: packages/WorkspaceKit
  GitKit:
    path: packages/GitKit
  LangKit:
    path: packages/LangKit
  EditorKit:
    path: packages/EditorKit
  # P0 spike 2: local models (moves into ModelKit after the spike).
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OmnieDev:
    type: application
    platform: iOS
    sources:
      - apps/ipad/Sources
    dependencies:
      - package: DesignKit
      - package: CommandKit
      - package: WorkspaceKit
      - package: GitKit
      - package: LangKit
      - package: EditorKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wckd.omniedev
        PRODUCT_NAME: OmnieDev
        # 1 = iPhone (vibecoding), 2 = iPad (full IDE)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Omnie-dev
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: apps/ipad/OmnieDev.entitlements
        DEVELOPMENT_TEAM: XKA8CGC2AB
        ENABLE_PREVIEWS: YES
