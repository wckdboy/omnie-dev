version = 1

# Files that can't carry an SPDX comment header.
[[annotations]]
path = ["**/*.json", "**/*.md", "**/*.yml", "**/*.toml", "**/Package.resolved", ".gitignore", ".github/**", "NOTICE",
        "packages/RunKit/Tests/wasi-probe/wasi-probe.wasm", "packages/RunKit/Tests/wasi-probe/Cargo.lock"]
SPDX-FileCopyrightText = "2026 wckdboy and Omnie-dev contributors"
SPDX-License-Identifier = "Apache-2.0"


# The app icon is outside the Apache-2.0 grant (TRADEMARKS.md).
[[annotations]]
path = ["apps/ipad/Resources/Assets.xcassets/AppIcon.appiconset/*.png", "brand/icon/**"]
SPDX-FileCopyrightText = "2026 wckdboy"
SPDX-License-Identifier = "LicenseRef-Omnie-dev-Icon"
