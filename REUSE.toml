version = 1

# Files that can't carry an SPDX comment header.
[[annotations]]
path = ["**/*.json", "**/*.md", "**/*.yml", "**/*.toml", "**/Package.resolved", ".gitignore", ".github/**", "NOTICE",
        "packages/RunKit/Tests/wasi-probe/wasi-probe.wasm", "**/Cargo.lock"]
SPDX-FileCopyrightText = "2026 wckdboy and Omnie-dev contributors"
SPDX-License-Identifier = "Apache-2.0"


# The app icon is outside the Apache-2.0 grant (TRADEMARKS.md).
[[annotations]]
path = ["apps/ipad/Resources/Assets.xcassets/AppIcon.appiconset/*.png", "brand/icon/**"]
SPDX-FileCopyrightText = "2026 wckdboy"
SPDX-License-Identifier = "LicenseRef-Omnie-dev-Icon"

# The plane test's fixture project: sources kept free of headers, like a user's project.
[[annotations]]
path = ["fixtures/**"]
SPDX-FileCopyrightText = "2026 wckdboy and Omnie-dev contributors"
SPDX-License-Identifier = "Apache-2.0"

# jaq-json 1.1.3 (MIT, https://github.com/01mf02/jaq), vendored with one patch for the WASI jq.
[[annotations]]
path = ["tools/wasi/jq/patches/jaq-json/**"]
precedence = "override"
SPDX-FileCopyrightText = "Michael Färber <michael.faerber@gedenkt.at>"
SPDX-License-Identifier = "MIT"
