version = 1

# Files that can't carry an SPDX comment header.
[[annotations]]
path = ["**/*.json", "**/*.md", "**/*.yml", "**/*.toml", "**/Package.resolved", ".gitignore", ".github/**", "NOTICE"]
SPDX-FileCopyrightText = "2026 wckdboy and Omnie-dev contributors"
SPDX-License-Identifier = "Apache-2.0"

# tree-sitter grammars and queries vendored by scripts/vendor-grammars.py (not committed;
# each grammar's upstream LICENSE is copied next to its sources).
[[annotations]]
path = ["packages/LangKit/Sources/TreeSitterGrammars/*/**", "packages/LangKit/Sources/LangKit/Resources/queries/**"]
SPDX-FileCopyrightText = "tree-sitter grammar authors (see packages/LangKit/Sources/TreeSitterGrammars/*/LICENSE)"
SPDX-License-Identifier = "MIT"
