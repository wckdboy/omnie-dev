#
# The packages' tests are split so one flaky WebKit suite can't fail the whole run: a `vendor` job
# builds and caches the native inputs once, then every package is its own matrix job (in parallel),
# RunKit runs with its WebKit suites quarantined behind a retry-once, and EditorKit (a simulator
# build, and the editor performance budgets) is its own job. The app's UI tests run on main, nightly
# and on demand. Standard GitHub-hosted runners (macos-26, ubuntu) are free for this public repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A newer push to a pull request replaces its run; every push to main runs to the end (its UI tests too).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reuse:
    name: Licences (REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v5

  # The packages to test, minus RunKit (WebKit, quarantined) and EditorKit (a simulator build):
  # both get their own jobs. Computed so a new package can't be forgotten.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: Packages for the matrix
        run: |
          readarray -t names < <(find packages -mindepth 1 -maxdepth 1 -type d -exec basename {} + \
            | grep -vE '^(RunKit|EditorKit)$' | sort)
          printf 'matrix: %s\n' "${names[*]}"
          echo "packages=$(printf '%s\n' "${names[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  # Builds the hash-pinned native inputs once and saves them; the test jobs restore and never rebuild.
  vendor:
    name: Vendored inputs
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: brew install ninja
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v6
        with:
          path: packages/GitKit/Vendor
          key: libgit2-${{ hashFiles('scripts/build-git-deps.sh', 'scripts/patches/**') }}
      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-git-deps.sh

      - name: Cache grammars
        id: grammars
        uses: actions/cache@v6
        with:
          path: |
            packages/LangKit/Sources/TreeSitterGrammars
            packages/LangKit/Sources/LangKit/Resources/queries
            packages/LangKit/REUSE.toml
          key: grammars-${{ hashFiles('scripts/vendor-grammars.py') }}
      - name: Vendor grammars
        if: steps.grammars.outputs.cache-hit != 'true'
        run: python3 scripts/vendor-grammars.py

      - name: Cache RunKit bundles
        id: runkit
        uses: actions/cache@v6
        with:
          path: |
            packages/RunKit/Sources/RunKit/JS/sucrase.js
            packages/RunKit/Sources/RunKit/JS/sucrase-LICENSE.txt
            packages/RunKit/Sources/RunKit/JS/pyodide
            packages/RunKit/Sources/RunKit/JS/packages
          key: runkit-${{ hashFiles('scripts/vendor-runkit.sh', 'scripts/runkit/**', 'tools/wasi/**', 'scripts/collect-cargo-licenses.py') }}
      - name: Vendor RunKit
        if: steps.runkit.outputs.cache-hit != 'true'
        run: scripts/vendor-runkit.sh

  # One job per package, in parallel: a failure in one names the package and doesn't stop the rest.
  packages:
    name: ${{ matrix.package }}
    needs: [plan, vendor]
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Restore libgit2
        uses: actions/cache@v6
        with:
          path: packages/GitKit/Vendor
          key: libgit2-${{ hashFiles('scripts/build-git-deps.sh', 'scripts/patches/**') }}
      - name: Restore grammars
        uses: actions/cache@v6
        with:
          path: |
            packages/LangKit/Sources/TreeSitterGrammars
            packages/LangKit/Sources/LangKit/Resources/queries
            packages/LangKit/REUSE.toml
          key: grammars-${{ hashFiles('scripts/vendor-grammars.py') }}
      - name: Restore RunKit bundles
        uses: actions/cache@v6
        with:
          path: |
            packages/RunKit/Sources/RunKit/JS/sucrase.js
            packages/RunKit/Sources/RunKit/JS/sucrase-LICENSE.txt
            packages/RunKit/Sources/RunKit/JS/pyodide
            packages/RunKit/Sources/RunKit/JS/packages
          key: runkit-${{ hashFiles('scripts/vendor-runkit.sh', 'scripts/runkit/**', 'tools/wasi/**', 'scripts/collect-cargo-licenses.py') }}
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('packages/*/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Test ${{ matrix.package }}
        env:
          XCODEBUILD_FLAGS: CODE_SIGNING_ALLOWED=NO
        run: scripts/test-all.sh --only "${{ matrix.package }}"

  # RunKit drives WebKit/Pyodide: its deterministic suites run always, and the WebKit suites are
  # quarantined behind a retry-once with a clear "stalled" signal (they starve a shared process).
  runkit:
    name: RunKit (WebKit retried)
    needs: vendor
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Restore libgit2
        uses: actions/cache@v6
        with:
          path: packages/GitKit/Vendor
          key: libgit2-${{ hashFiles('scripts/build-git-deps.sh', 'scripts/patches/**') }}
      - name: Restore RunKit bundles
        uses: actions/cache@v6
        with:
          path: |
            packages/RunKit/Sources/RunKit/JS/sucrase.js
            packages/RunKit/Sources/RunKit/JS/sucrase-LICENSE.txt
            packages/RunKit/Sources/RunKit/JS/pyodide
            packages/RunKit/Sources/RunKit/JS/packages
          key: runkit-${{ hashFiles('scripts/vendor-runkit.sh', 'scripts/runkit/**', 'tools/wasi/**', 'scripts/collect-cargo-licenses.py') }}
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('packages/*/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: RunKit's deterministic suites
        working-directory: packages/RunKit
        run: swift test --skip WebKitSuites
      - name: RunKit's WebKit suites (retried once)
        working-directory: packages/RunKit
        run: |
          set +e
          swift test --filter WebKitSuites
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning title=WebKit suites stalled or failed::RunKit's WebKit suites failed; retrying once (a known flake: Pyodide and Mermaid starve a shared WebKit process)."
            swift test --filter WebKitSuites
          fi

  # EditorKit is iOS-only (a simulator build) and carries the editor performance budgets, so a
  # regression — including on the nightly run — fails here.
  editor:
    name: EditorKit (simulator + perf)
    needs: vendor
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Restore grammars
        uses: actions/cache@v6
        with:
          path: |
            packages/LangKit/Sources/TreeSitterGrammars
            packages/LangKit/Sources/LangKit/Resources/queries
            packages/LangKit/REUSE.toml
          key: grammars-${{ hashFiles('scripts/vendor-grammars.py') }}
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('packages/*/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: EditorKit tests (and the perf budgets)
        env:
          XCODEBUILD_FLAGS: CODE_SIGNING_ALLOWED=NO
        run: scripts/test-all.sh --only EditorKit

  ui:
    name: UI tests
    if: github.event_name != 'pull_request'
    needs: [packages, runkit, editor]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: brew install xcodegen
      - name: Restore libgit2
        uses: actions/cache@v6
        with:
          path: packages/GitKit/Vendor
          key: libgit2-${{ hashFiles('scripts/build-git-deps.sh', 'scripts/patches/**') }}
      - name: Restore grammars
        uses: actions/cache@v6
        with:
          path: |
            packages/LangKit/Sources/TreeSitterGrammars
            packages/LangKit/Sources/LangKit/Resources/queries
            packages/LangKit/REUSE.toml
          key: grammars-${{ hashFiles('scripts/vendor-grammars.py') }}
      - name: Restore RunKit bundles
        uses: actions/cache@v6
        with:
          path: |
            packages/RunKit/Sources/RunKit/JS/sucrase.js
            packages/RunKit/Sources/RunKit/JS/sucrase-LICENSE.txt
            packages/RunKit/Sources/RunKit/JS/pyodide
            packages/RunKit/Sources/RunKit/JS/packages
          key: runkit-${{ hashFiles('scripts/vendor-runkit.sh', 'scripts/runkit/**', 'tools/wasi/**', 'scripts/collect-cargo-licenses.py') }}
      - name: App project
        run: xcodegen generate -q
      - name: UI tests
        env:
          XCODEBUILD_FLAGS: CODE_SIGNING_ALLOWED=NO
        run: |
          set -o pipefail
          scripts/test-all.sh --ui-only 2>&1 | tail -5
      - name: Results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: .build/test-all/app/Logs/Test
          retention-days: 7
